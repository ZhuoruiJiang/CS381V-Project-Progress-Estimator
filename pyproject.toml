[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "progress-reward"
version = "0.2.0"
description = "Learned progress rewards for robot RL on RoboCasa: RARM, a fine-tuned comparator and HMM matching"
requires-python = ">=3.12,<3.13"
# Pinned versions (and CUDA PyTorch) are installed by scripts/setup/*; the package itself is then
# installed with `uv pip install --no-deps -e .`.
dependencies = [
  "torch>=2.7,<2.8",
  "numpy>=2,<3",
  "pyyaml>=6,<7",
  "huggingface-hub",
  "pyarrow",
  "av",
  "pillow",
  "mujoco==3.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
pr-download = "progress_reward.data.download:main"
pr-check-task = "progress_reward.sim.check_task:main"
pr-train-rl = "progress_reward.rl.train:main"
pr-eval-rl = "progress_reward.rl.evaluate:main"
pr-dashboard = "progress_reward.rl.report:main"
pr-figures = "progress_reward.rl.figures:main"
pr-finetune-collect = "progress_reward.finetune.collect:main"
pr-finetune = "progress_reward.finetune.train:main"
pr-record = "progress_reward.evaluation.record:main"
pr-score = "progress_reward.evaluation.score:main"
pr-report = "progress_reward.evaluation.report:main"
pr-view = "progress_reward.viewer.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"progress_reward.viewer" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
